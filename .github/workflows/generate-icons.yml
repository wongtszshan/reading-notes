name: Generate mobile app icons
on:
  push:
    paths:
      - assets/icon.svg
      - .github/workflows/generate-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size, filename in [(180, "apple-touch-icon.png"), (192, "assets/icon-192.png"), (512, "assets/icon-512.png")]:
              cairosvg.svg2png(url="assets/icon.svg", write_to=filename, output_width=size, output_height=size)
          PY
      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate mobile PWA icons"
            git push
          fi
